name: NIFTY Live Engine

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC. Times below are India Standard Time (UTC+5:30).
    # 09:00 IST boot
    - cron: "30 3 * * 1-5"
    # 09:10 IST pre-session NIFTY spot report
    - cron: "40 3 * * 1-5"
    # 09:15 IST strategy-session start + first status
    - cron: "45 3 * * 1-5"
    # Every 30 minutes thereafter: 09:45, 10:15, ... , 15:15 IST
    - cron: "15,45 4-9 * * 1-5"
    # CAS / closing-management checkpoints: 15:29, 15:35, 15:40 IST
    - cron: "59 9 * * 1-5"
    - cron: "5,10 10 * * 1-5"

permissions:
  contents: write

concurrency:
  group: nifty-live-engine
  cancel-in-progress: false

jobs:
  nifty-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      TZ: Asia/Kolkata

      # Stable filenames. Keep these names unchanged when a new research version is promoted.
      NIFTY_ENGINE_PATH: NIFTY_RULES_ONLY_ENGINE.py
      NIFTY_LIVE_RUNNER_PATH: NIFTY_LIVE_ENGINE.py
      NIFTY_PROVIDER: yahoo

      # Session schedule consumed by the live runner.
      NIFTY_BOOT_TIME: "09:00"
      NIFTY_PRESESSION_TIME: "09:10"
      NIFTY_STRATEGY_START_TIME: "09:15"
      NIFTY_STRATEGY_LAST_TIME: "15:15"
      NIFTY_CAS_PROVISIONAL_TIME: "15:29"
      NIFTY_CAS_FINAL_TIME: "15:35"
      NIFTY_FNO_CLOSE_TIME: "15:40"

      # Persistent live state/cache and logs.
      NIFTY_STATE_PATH: runtime/nifty_live_state.json
      NIFTY_LIVE_CACHE: runtime/nifty_live_minutes.csv
      NIFTY_CACHE_DAYS: "90"
      NIFTY_RUNTIME_DIR: runtime

      NIFTY_EVENT_LOG: logs/nifty_trade_events.csv
      NIFTY_STATUS_LOG: logs/nifty_status_30m.csv
      NIFTY_CAS_LOG: logs/nifty_cas_management.csv
      NIFTY_ERROR_LOG: logs/nifty_errors.csv
      NIFTY_EXCEL_REPORT: reports/NIFTY_LIVE_Trade_Report.xlsx

      # Event detection + Telegram cadence.
      NIFTY_ALERT_LOOKBACK_MIN: "45"
      NIFTY_STATUS_MINUTES: "30"

      # CAS/F&O live-management default.
      NIFTY_CAS_HARVEST_TRIGGER: "70"

      # Required repository secrets.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show run clock
        shell: bash
        run: |
          echo "UTC: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "IST: $(TZ=Asia/Kolkata date +'%Y-%m-%d %H:%M:%S %Z')"
          echo "Branch: ${{ github.ref_name }}"

      - name: Gate to weekday 09:00-15:40 IST
        id: market_window
        shell: bash
        run: |
          NOW_IST="$(TZ=Asia/Kolkata date +'%H%M')"
          DOW="$(TZ=Asia/Kolkata date +'%u')"
          RUN=false
          if [ "$DOW" -ge 1 ] && [ "$DOW" -le 5 ] && \
             [ "$NOW_IST" -ge 0900 ] && [ "$NOW_IST" -le 1540 ]; then
            RUN=true
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Verify and stage stable GitHub files
        if: steps.market_window.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root contents:"
          ls -la

          stage_file() {
            local name="$1"
            if [ -f "$name" ]; then
              echo "Found $name in repository root."
              return 0
            fi

            local found
            found="$(find . -maxdepth 4 -type f -name "$name" -not -path './.git/*' -print -quit)"
            if [ -n "$found" ]; then
              echo "Found $name at $found; staging a root copy for this run."
              cp "$found" "$name"
              return 0
            fi

            echo "::error file=$name::Required file $name is not committed anywhere in this repository."
            echo "Upload/commit $name to the repository root (recommended) and rerun."
            exit 1
          }

          stage_file "$NIFTY_ENGINE_PATH"
          stage_file "$NIFTY_LIVE_RUNNER_PATH"

          test -s "$NIFTY_ENGINE_PATH"
          test -s "$NIFTY_LIVE_RUNNER_PATH"
          sha256sum "$NIFTY_ENGINE_PATH" "$NIFTY_LIVE_RUNNER_PATH"

      - name: Set up Python
        if: steps.market_window.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.market_window.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests yfinance xlsxwriter

      - name: Compile engines
        if: steps.market_window.outputs.run == 'true'
        run: |
          python -m py_compile "$NIFTY_ENGINE_PATH" "$NIFTY_LIVE_RUNNER_PATH"

      - name: Run NIFTY live engine and Telegram alerts
        if: steps.market_window.outputs.run == 'true'
        run: |
          python "$NIFTY_LIVE_RUNNER_PATH" \
            --engine "$NIFTY_ENGINE_PATH" \
            --provider "$NIFTY_PROVIDER" \
            --state "$NIFTY_STATE_PATH" \
            --cache "$NIFTY_LIVE_CACHE" \
            --event-log "$NIFTY_EVENT_LOG" \
            --status-log "$NIFTY_STATUS_LOG" \
            --cas-log "$NIFTY_CAS_LOG" \
            --error-log "$NIFTY_ERROR_LOG" \
            --excel-report "$NIFTY_EXCEL_REPORT" \
            --alert-lookback-min "$NIFTY_ALERT_LOOKBACK_MIN" \
            --status-minutes "$NIFTY_STATUS_MINUTES"

      - name: Persist live cache, state, logs and Excel report
        if: steps.market_window.outputs.run == 'true' && always()
        shell: bash
        run: |
          set -e
          git config user.name "nifty-live-bot"
          git config user.email "nifty-live-bot@users.noreply.github.com"

          mkdir -p runtime logs reports
          git add runtime/ logs/ reports/ || true

          if git diff --cached --quiet; then
            echo "No live-state changes to commit."
            exit 0
          fi

          git commit -m "Update NIFTY live state [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}" || true
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Show latest live state
        if: steps.market_window.outputs.run == 'true' && always()
        shell: bash
        run: |
          if [ -f "$NIFTY_STATE_PATH" ]; then
            cat "$NIFTY_STATE_PATH"
          fi
