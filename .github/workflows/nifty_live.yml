name: nifty-live

on:
  workflow_dispatch:
  schedule:
    # India Standard Time = UTC +05:30
    # 09:00 IST scheduler/pre-session start
    - cron: '30 3 * * 1-5'
    # 09:10 IST pre-session price report
    - cron: '40 3 * * 1-5'
    # Check every 5 minutes from 09:15 IST through 09:25 IST
    - cron: '45-55/5 3 * * 1-5'
    # Check every 5 minutes from 09:30 IST through 14:25 IST
    - cron: '*/5 4-8 * * 1-5'
    # Check every 5 minutes from 14:30 IST through 15:15 IST
    - cron: '0-45/5 9 * * 1-5'
    # 15:30 IST close/report run; reports completed 15:29 spot
    - cron: '0 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nifty-live
  cancel-in-progress: false

jobs:
  nifty-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Kolkata
      NIFTY_SYMBOL: ^NSEI
      NIFTY_ENGINE: NIFTY_RULES_ONLY_ENGINE.py
      LIVE_CACHE: live_cache.csv
      LIVE_STATE: live_state.json
      LIVE_STATUS: live_status.json
      LIVE_TRADES: live_trades.csv
      MIN_WARMUP_SESSIONS: '5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # IMPORTANT: no pip cache here. setup-python cache requires a dependency
      # file to exist before this step and was the cause of the previous error.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show repository files
        run: |
          echo "Repository root:"
          pwd
          ls -la

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            echo "Installing from requirements.txt"
            python -m pip install -r requirements.txt
          else
            echo "requirements.txt not found; installing required packages directly"
            python -m pip install \
              'numpy>=1.26,<3' \
              'pandas>=2.2,<3' \
              'yfinance>=0.2.54,<1' \
              'requests>=2.32,<3' \
              'numba>=0.60,<1'
          fi

      - name: Validate required engine files
        shell: bash
        run: |
          test -f NIFTY_RULES_ONLY_ENGINE.py || { echo "ERROR: NIFTY_RULES_ONLY_ENGINE.py missing"; exit 1; }
          test -f NIFTY_LIVE_ENGINE.py || { echo "ERROR: NIFTY_LIVE_ENGINE.py missing"; exit 1; }
          echo "Required R7 files found."

      - name: Run NIFTY R7 live check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python NIFTY_LIVE_ENGINE.py

      - name: Persist cache, state and viewer data
        if: always()
        shell: bash
        run: |
          git config user.name "nifty-live-bot"
          git config user.email "nifty-live-bot@users.noreply.github.com"
          for f in live_cache.csv live_state.json live_status.json live_trades.csv; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            git commit -m "chore: update NIFTY live state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No live-state changes to commit."
          fi
