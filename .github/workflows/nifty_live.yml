name: nifty-live

on:
  workflow_dispatch:
  schedule:
    # India Standard Time = UTC +05:30
    # 09:00 IST scheduler/pre-session start
    - cron: '30 3 * * 1-5'
    # 09:10 IST pre-session price report
    - cron: '40 3 * * 1-5'
    # Check every 5 minutes from 09:15 IST through 09:25 IST
    - cron: '45-55/5 3 * * 1-5'
    # Check every 5 minutes from 09:30 IST through 14:25 IST
    - cron: '*/5 4-8 * * 1-5'
    # Check every 5 minutes from 14:30 IST through 15:15 IST
    - cron: '0-45/5 9 * * 1-5'
    # 15:30 IST close/report run; reports completed 15:29 spot
    - cron: '0 10 * * 1-5'

permissions:
  contents: write

concurrency:
  group: nifty-live
  cancel-in-progress: false

jobs:
  nifty-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Kolkata
      NIFTY_SYMBOL: ^NSEI
      R7_ENGINE: NIFTY_R7_RULES_ONLY_ENGINE.py
      LIVE_CACHE: live_cache.csv
      LIVE_STATE: live_state.json
      LIVE_STATUS: live_status.json
      LIVE_TRADES: live_trades.csv
      MIN_WARMUP_SESSIONS: '5'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Validate required files
        run: |
          test -f NIFTY_R7_RULES_ONLY_ENGINE.py
          test -f NIFTY_LIVE_ENGINE.py
          test -f requirements.txt

      - name: Run NIFTY R7 live check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python NIFTY_LIVE_ENGINE.py

      - name: Persist cache, state and viewer data
        if: always()
        run: |
          git config user.name "nifty-live-bot"
          git config user.email "nifty-live-bot@users.noreply.github.com"
          git add live_cache.csv live_state.json live_status.json live_trades.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update NIFTY live state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No live-state changes to commit."
          fi
