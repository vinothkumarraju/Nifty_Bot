name: nifty-live

on:
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. Run every 5 minutes from 09:00 through 15:40 IST.
    # Repeating slots make 09:00 / 09:10 / 09:15 alerts self-healing if one
    # scheduled invocation is delayed or dropped by GitHub.
    - cron: '30-55/5 3 * * 1-5'   # 09:00-09:25 IST
    - cron: '*/5 4-9 * * 1-5'     # 09:30-15:25 IST
    - cron: '0-10/5 10 * * 1-5'   # 15:30-15:40 IST

permissions:
  contents: write

concurrency:
  group: nifty-live
  cancel-in-progress: false

jobs:
  nifty-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TZ: Asia/Kolkata
      NIFTY_SYMBOL: ^NSEI
      NIFTY_ENGINE: NIFTY_RULES_ONLY_ENGINE.py
      LIVE_CACHE: live_cache.csv
      LIVE_STATE: live_state.json
      LIVE_STATUS: live_status.json
      LIVE_TRADES: live_trades.csv
      MIN_WARMUP_SESSIONS: '5'
      NIFTY_TRIGGER: ${{ github.event_name }}
      NIFTY_GITHUB_RUN_ID: ${{ github.run_id }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Show repository files
        run: |
          echo "Repository root: $(pwd)"
          ls -la

      - name: Validate required files
        shell: bash
        run: |
          test -f NIFTY_RULES_ONLY_ENGINE.py || { echo "::error::NIFTY_RULES_ONLY_ENGINE.py missing from repository root"; exit 1; }
          test -f NIFTY_LIVE_ENGINE.py || { echo "::error::NIFTY_LIVE_ENGINE.py missing from repository root"; exit 1; }
          echo "Required live files found."

      - name: Validate Python syntax
        shell: bash
        run: |
          python -m py_compile NIFTY_RULES_ONLY_ENGINE.py NIFTY_LIVE_ENGINE.py

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'numpy>=1.26,<3' \
            'pandas>=2.2,<3' \
            'yfinance>=0.2.54,<1' \
            'requests>=2.32,<3' \
            'numba>=0.60,<1' \
            'xlsxwriter>=3.2,<4'

      - name: Validate Telegram configuration
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "::error::Missing GitHub secret TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$TELEGRAM_CHAT_ID" || { echo "::error::Missing GitHub secret TELEGRAM_CHAT_ID"; exit 1; }
          python - <<'PY2'
          import os, requests, sys
          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat = os.environ['TELEGRAM_CHAT_ID']
          r = requests.get(f"https://api.telegram.org/bot{token}/getMe", timeout=20)
          if not r.ok or not r.json().get('ok'):
              print('::error::Telegram bot token validation failed')
              print(r.text[:500])
              sys.exit(1)
          r = requests.get(f"https://api.telegram.org/bot{token}/getChat", params={'chat_id': chat}, timeout=20)
          if not r.ok or not r.json().get('ok'):
              print('::error::Telegram chat ID validation failed. Open the bot in Telegram, press Start, and verify TELEGRAM_CHAT_ID.')
              print(r.text[:500])
              sys.exit(1)
          print('Telegram bot token and chat ID validated.')
          PY2

      - name: Run NIFTY R9-LF8 live check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python NIFTY_LIVE_ENGINE.py

      - name: Persist cache, state, logs and report
        if: always()
        shell: bash
        run: |
          git config user.name "nifty-live-bot"
          git config user.email "nifty-live-bot@users.noreply.github.com"
          for f in live_cache.csv live_state.json live_status.json live_trades.csv; do
            [ -f "$f" ] && git add "$f"
          done
          [ -d logs ] && git add logs/ || true
          [ -d reports ] && git add reports/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update NIFTY live state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "No live-state changes to commit."
          fi
